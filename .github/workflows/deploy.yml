name: Build and Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values: nothing here talks to a database or signs real tokens,
      # but some modules validate that these exist when imported.
      DATABASE_URL: postgres://x:x@127.0.0.1:1/x
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Route/page types that `next build` would normally generate.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # Becomes next.config's deploymentId. Without it the build ran with
          # an empty id, so half the chunk URLs carried "?dpl=" and half didn't
          # and the browser downloaded every chunk twice.
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/mdnhs/sleep-sheet-turbo:latest
            ghcr.io/mdnhs/sleep-sheet-turbo:stage
            ghcr.io/mdnhs/sleep-sheet-turbo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy's per-application deploy webhook: it can only redeploy this one
      # app (pulling :latest), unlike an API key which controls the whole server.
      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK secret is not set"
            exit 1
          fi
          curl -fsS --max-time 60 -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" -d '{}'
