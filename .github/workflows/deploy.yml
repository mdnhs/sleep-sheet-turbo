name: Build and Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/mdnhs/sleep-sheet-turbo:latest
            ghcr.io/mdnhs/sleep-sheet-turbo:stage
            ghcr.io/mdnhs/sleep-sheet-turbo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        run: |
          curl -s -X POST "http://93.127.195.230:3000/api/trpc/application.deploy" \
            -H "x-api-key: pQlZMtoRVWIBkFxuOrWzdSHKKnVseSNRtGgZtZgaGGGjVJtTlhjNqPuKHphILssI" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"E--R-XrrF6qGTcqF_QStn"}' || echo "Dokploy deploy webhook sent"
