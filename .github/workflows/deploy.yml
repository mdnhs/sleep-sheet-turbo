name: Build and Deploy to Dokploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Global concurrency group across all branches (main & preview) so multiple
# workflows never hit Dokploy simultaneously, preventing VPS RAM exhaustion.
concurrency:
  group: dokploy-vps-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values: nothing here talks to a database or signs real tokens,
      # but some modules validate that these exist when imported.
      DATABASE_URL: postgres://x:x@127.0.0.1:1/x
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Route/page types that `next build` would normally generate.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tags and deployment target
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "preview" ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
            echo "webhook=${{ secrets.DOKPLOY_PREVIEW_DEPLOY_WEBHOOK }}" >> "$GITHUB_OUTPUT"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/mdnhs/sleep-sheet-turbo:preview" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/mdnhs/sleep-sheet-turbo:preview-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "webhook=${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}" >> "$GITHUB_OUTPUT"
            echo "tags<<EOF" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/mdnhs/sleep-sheet-turbo:latest" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/mdnhs/sleep-sheet-turbo:stage" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/mdnhs/sleep-sheet-turbo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # Becomes next.config's deploymentId. Without it the build ran with
          # an empty id, so half the chunk URLs carried "?dpl=" and half didn't
          # and the browser downloaded every chunk twice.
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          tags: ${{ steps.config.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy's per-application deploy webhook:
      # For preview branch: triggers DOKPLOY_PREVIEW_DEPLOY_WEBHOOK
      # For main branch: triggers DOKPLOY_DEPLOY_WEBHOOK
      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK: ${{ steps.config.outputs.webhook }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "::error::Deploy webhook secret is not set for target: ${{ steps.config.outputs.target }}"
            exit 1
          fi
          curl -fsS --max-time 60 -X POST "$DOKPLOY_WEBHOOK" \
            -H "Content-Type: application/json" -d '{}'

      - name: Cool down for VPS memory stabilization
        run: |
          echo "Waiting 30s for Dokploy to pull and restart containers before freeing the concurrency queue..."
          sleep 30

