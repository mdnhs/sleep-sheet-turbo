# Production Postgres for sleepsheetbd.com, run on the VPS.
#
#   postgres   – the database; NOT published to the internet
#   pgbouncer  – the only public entry point (port 6432, TLS required),
#                pools the many short-lived Vercel function connections
#   backup     – nightly pg_dump with rotation into ./backups
#
# See README.md in this directory for setup and the Neon cutover runbook.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=UTC
    # Loopback only: reachable from the VPS itself (or an SSH tunnel) for
    # migrations and admin work, never from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      AUTH_TYPE: scram-sha-256
      # Transaction pooling: a server connection is held only for the length
      # of a transaction, so hundreds of idle function connections share a
      # few real ones. node-postgres (unnamed statements) works with this.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      LISTEN_PORT: 6432
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_CERT_FILE: /certs/fullchain.pem
      CLIENT_TLS_KEY_FILE: /certs/privkey.pem
    ports:
      - "6432:6432"
    volumes:
      - ./certs:/certs:ro
    networks: [db]

  backup:
    image: prodrigestivill/postgres-backup-local:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_EXTRA_OPTS: "--format=custom"
      SCHEDULE: "0 3 * * *"   # 03:00 UTC = 09:00 Dhaka
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    networks: [db]

volumes:
  pgdata:

networks:
  db:
